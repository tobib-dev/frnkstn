
syntax = "proto3";

package sessions.v1;

option go_package = "github.com/tobib-dev/frnkstn/api/proto/users/v1";

service SessionService {
    rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse) {}
}

message CreateSessionRequest {
    string access_token = 1;
    string refresh_token = 2;
    string expires_at = 3;
    string revoked_at = 4;
    string user_id = 5;
}

message CreateSessionResponse {
    string session_id = 1;
    string refresh_token = 2;
    string expires_at = 3;
    string revoked_at = 4;
    string user_id = 5;
}
